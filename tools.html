<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyWebTab 工具箱</title><link rel="stylesheet" href="src/tools.css"></head>
<body>
  <header class="tool-header"><a class="tool-brand" href="newtab.html"><span>M</span><div><strong>MyWebTab</strong><small>开发工具箱</small></div></a><nav><a href="newtab.html">首页</a><a class="active" href="tools.html">工具箱</a></nav></header>
  <main class="tool-shell">
    <aside><div class="aside-title">常用工具</div><button class="tool-nav active" data-tool="json"><i>{ }</i><span>JSON 工具<small>格式化、压缩与转义</small></span></button><button class="tool-nav" data-tool="md5"><i>MD5</i><span>MD5 摘要<small>生成与结果比对</small></span></button><button class="tool-nav" data-tool="uuid"><i>UUID</i><span>GUID 生成器<small>批量生成随机标识</small></span></button><button class="tool-nav" data-tool="time"><i>TIME</i><span>时间戳转换<small>日期与时间戳互转</small></span></button><button class="tool-nav" data-tool="http"><i>HTTP</i><span>接口调试<small>发送 HTTP API 请求</small></span></button><button class="tool-nav" data-tool="socket"><i>WS</i><span>网络测试<small>WebSocket 与 MQTT</small></span></button></aside>
    <section class="tool-content">
      <div class="tool-intro"><div><span>Developer toolkit</span><h1 id="toolTitle">JSON 工具</h1><p id="toolDescription">所有处理均在浏览器本地完成。</p></div><div class="privacy-badge">● 本地优先</div></div>
      <article class="tool-panel active" data-panel="json"><div class="editor-grid"><label>输入<textarea id="jsonInput" placeholder='粘贴 JSON，例如 {"hello":"world"}'></textarea></label><label>结果<textarea id="jsonOutput" readonly></textarea></label></div><div class="actions"><button data-json="format">格式化</button><button data-json="minify">压缩</button><button data-json="escape">转义</button><button data-json="unescape">去除转义</button><button class="ghost" data-copy="jsonOutput">复制结果</button></div><div class="status" id="jsonStatus"></div></article>
      <article class="tool-panel" data-panel="md5"><label class="block-label">待计算文本<textarea id="md5Input" placeholder="输入任意文本"></textarea></label><div class="actions"><button id="md5Generate">生成 MD5</button><button class="ghost" data-copy="md5Result">复制摘要</button></div><label class="block-label">MD5 结果<input id="md5Result" readonly></label><label class="block-label">比对已有 MD5<input id="md5Compare" placeholder="输入 32 位 MD5 后自动比对"></label><div class="status" id="md5Status">MD5 是不可逆摘要，无法解密；可通过重新计算原文进行比对。</div></article>
      <article class="tool-panel" data-panel="uuid"><div class="inline-fields"><label>数量<input id="uuidCount" type="number" min="1" max="100" value="5"></label><label>格式<select id="uuidCase"><option value="lower">小写</option><option value="upper">大写</option></select></label><label class="check"><input id="uuidHyphen" type="checkbox" checked>保留连字符</label></div><div class="actions"><button id="uuidGenerate">生成 GUID</button><button class="ghost" data-copy="uuidOutput">复制全部</button></div><textarea id="uuidOutput" readonly></textarea></article>
      <article class="tool-panel" data-panel="time"><div class="convert-card"><label>时间戳<input id="timestampInput" placeholder="秒或毫秒时间戳"></label><button id="timestampToDate">转换为日期 ↓</button><label>本地日期时间<input id="dateInput" type="datetime-local" step="1"></label><button id="dateToTimestamp">转换为时间戳 ↑</button></div><div class="result-box" id="timeResult">等待转换</div><button class="ghost now-button" id="useNow">使用当前时间</button></article>
      <article class="tool-panel" data-panel="http"><div class="request-line"><select id="httpMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input id="httpUrl" placeholder="https://api.example.com/data"><button id="sendHttp">发送请求</button></div><div class="editor-grid"><label>请求头（JSON）<textarea id="httpHeaders" placeholder='{"Authorization":"Bearer ..."}'></textarea></label><label>请求体<textarea id="httpBody" placeholder="JSON、文本或表单内容"></textarea></label></div><div class="response-meta" id="httpMeta">尚未发送请求</div><pre id="httpResponse">响应内容将显示在这里</pre></article>
      <article class="tool-panel" data-panel="socket"><div class="socket-tabs"><button class="active" data-socket-tab="ws">WebSocket</button><button data-socket-tab="mqtt">MQTT over WebSocket</button></div><div data-socket-pane="ws"><div class="request-line"><input id="wsUrl" value="wss://echo.websocket.events"><button id="wsConnect">连接</button><button class="danger" id="wsDisconnect">断开</button></div><div class="request-line"><input id="wsMessage" placeholder="要发送的消息"><button id="wsSend">发送</button></div></div><div class="hidden" data-socket-pane="mqtt"><div class="request-line"><input id="mqttUrl" placeholder="wss://broker.example.com:8084/mqtt"><input id="mqttClientId" placeholder="Client ID"><button id="mqttConnect">连接</button></div><div class="request-line"><input id="mqttUsername" placeholder="用户名（可选）"><input id="mqttPassword" type="password" placeholder="密码（可选）"></div><div class="request-line"><input id="mqttTopic" placeholder="主题，例如 test/mywebtab"><input id="mqttMessage" placeholder="消息"><button id="mqttSubscribe">订阅</button><button id="mqttPublish">发布</button></div></div><div class="terminal" id="socketLog"><div class="log-info">等待建立连接…</div></div></article>
    </section>
  </main><div class="copy-toast" id="copyToast">已复制</div><script type="module" src="src/tools.js"></script>
</body></html>
