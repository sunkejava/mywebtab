<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyWebTab 工具箱</title><link rel="stylesheet" href="src/tools.css"><link rel="stylesheet" href="src/tools-extra.css"><link rel="stylesheet" href="src/tools-v22.css"></head>
<body>
  <header class="tool-header"><a class="tool-brand" href="newtab.html"><span>M</span><div><strong>MyWebTab</strong><small>开发工具箱</small></div></a><nav><a href="newtab.html">首页</a><a class="active" href="tools.html">工具箱</a></nav></header>
  <main class="tool-shell">
    <aside><div class="aside-title">常用工具</div><button class="tool-nav active" data-tool="json"><i>{ }</i><span>JSON 工具<small>格式化、压缩与转义</small></span></button><button class="tool-nav" data-tool="crypto"><i>SEC</i><span>加密与编码<small>AES、RC4、哈希、Base64</small></span></button><button class="tool-nav" data-tool="frontend"><i>FE</i><span>前端代码处理<small>格式化、压缩与混淆</small></span></button><button class="tool-nav" data-tool="regex"><i>.*</i><span>正则表达式<small>测试、替换与模板</small></span></button><button class="tool-nav" data-tool="diff"><i>DIFF</i><span>文本对比<small>JSON 与逐行文本对比</small></span></button><button class="tool-nav" data-tool="encoding"><i>ENC</i><span>编码转换<small>URL、UTF-8、ASCII</small></span></button><button class="tool-nav" data-tool="qr"><i>QR</i><span>二维码工具<small>生成、美化与识别</small></span></button><button class="tool-nav" data-tool="cron"><i>CRON</i><span>Cron 表达式<small>生成、解释与推算</small></span></button><button class="tool-nav" data-tool="color"><i>RGB</i><span>色彩与渐变<small>调色板、格式与 CSS</small></span></button><button class="tool-nav" data-tool="command"><i>CLI</i><span>命令查询<small>Linux、PowerShell、CMD</small></span></button><button class="tool-nav" data-tool="md5"><i>MD5</i><span>MD5 摘要<small>生成与结果比对</small></span></button><button class="tool-nav" data-tool="uuid"><i>UUID</i><span>GUID 生成器<small>批量生成随机标识</small></span></button><button class="tool-nav" data-tool="time"><i>TIME</i><span>时间戳转换<small>日期与时间戳互转</small></span></button><button class="tool-nav" data-tool="http"><i>HTTP</i><span>接口调试<small>发送 HTTP API 请求</small></span></button><button class="tool-nav" data-tool="socket"><i>WS</i><span>网络测试<small>WebSocket 与 MQTT</small></span></button></aside>
    <section class="tool-content">
      <div class="tool-intro"><div><span>Developer toolkit</span><h1 id="toolTitle">JSON 工具</h1><p id="toolDescription">所有处理均在浏览器本地完成。</p></div><div class="privacy-badge">● 本地优先</div></div>
      <article class="tool-panel active" data-panel="json"><div class="editor-grid"><label>输入<textarea id="jsonInput" placeholder='粘贴 JSON，例如 {"hello":"world"}'></textarea></label><label>结果<textarea id="jsonOutput" readonly></textarea></label></div><div class="actions"><button data-json="format">格式化</button><button data-json="minify">压缩</button><button data-json="escape">转义</button><button data-json="unescape">去除转义</button><button class="ghost" data-copy="jsonOutput">复制结果</button></div><div class="status" id="jsonStatus"></div></article>
      <article class="tool-panel" data-panel="crypto"><div class="inline-fields"><label>算法<select id="cryptoAlgorithm"><option value="AES-GCM">AES-GCM（推荐）</option><option value="RC4">RC4（兼容）</option><option value="BASE64">Base64</option><option value="SHA-1">SHA-1</option><option value="SHA-256">SHA-256</option><option value="SHA-384">SHA-384</option><option value="SHA-512">SHA-512</option></select></label><label>密钥/密码<input id="cryptoKey" value="mywebtab-secret"></label></div><div class="editor-grid"><label>原文/密文<textarea id="cryptoInput"></textarea></label><label>处理结果<textarea id="cryptoOutput" readonly></textarea></label></div><div class="actions"><button id="cryptoEncrypt">加密/编码</button><button id="cryptoDecrypt">解密/解码</button><button class="ghost" data-copy="cryptoOutput">复制</button></div><div class="status" id="cryptoStatus">AES 使用 PBKDF2 派生密钥和随机 IV；DES、RC4 等旧算法不建议用于新系统。</div></article>
      <article class="tool-panel" data-panel="frontend"><div class="inline-fields"><label>语言<select id="codeLanguage"><option value="js">JavaScript</option><option value="css">CSS</option><option value="html">HTML</option></select></label></div><div class="editor-grid"><label>源代码<textarea id="codeInput"></textarea></label><label>结果<textarea id="codeOutput" readonly></textarea></label></div><div class="actions"><button data-code="format">格式化</button><button data-code="minify">安全压缩</button><button data-code="obfuscate">JS Base64 混淆</button><button data-code="restore">还原 Base64 混淆</button><button class="ghost" data-copy="codeOutput">复制</button></div><div class="status" id="codeStatus"></div></article>
      <article class="tool-panel" data-panel="regex"><div class="inline-fields"><label>正则表达式<input id="regexPattern" value="\\b[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}\\b"></label><label>标志<input id="regexFlags" value="g"></label><label>常用模板<select id="regexTemplate"><option value="">选择模板</option><option value="email">邮箱</option><option value="mobile">中国大陆手机号</option><option value="url">URL</option><option value="ipv4">IPv4</option><option value="idcard">身份证号</option><option value="number">数字</option></select></label></div><label class="block-label">测试文本<textarea id="regexInput"></textarea></label><div class="actions"><button id="regexTest">测试匹配</button><button id="regexReplace">执行替换</button><input id="regexReplacement" placeholder="替换内容"></div><pre id="regexResult">等待测试</pre></article>
      <article class="tool-panel" data-panel="diff"><div class="inline-fields"><label>模式<select id="diffMode"><option value="text">逐行文本</option><option value="json">JSON 结构</option></select></label></div><div class="editor-grid"><label>原始内容<textarea id="diffLeft"></textarea></label><label>新内容<textarea id="diffRight"></textarea></label></div><div class="actions"><button id="runDiff">开始对比</button></div><pre id="diffResult">等待对比</pre></article>
      <article class="tool-panel" data-panel="encoding"><div class="inline-fields"><label>转换方式<select id="encodingMode"><option value="urlEncode">URL 编码</option><option value="urlDecode">URL 解码</option><option value="utf8">UTF-8 字节</option><option value="fromUtf8">UTF-8 字节还原</option><option value="ascii">ASCII/Unicode 码点</option><option value="fromAscii">码点还原</option><option value="htmlEncode">HTML 实体编码</option><option value="htmlDecode">HTML 实体解码</option></select></label></div><div class="editor-grid"><label>输入<textarea id="encodingInput"></textarea></label><label>输出<textarea id="encodingOutput" readonly></textarea></label></div><div class="actions"><button id="runEncoding">转换</button><button class="ghost" data-copy="encodingOutput">复制</button></div></article>
      <article class="tool-panel" data-panel="qr"><div class="inline-fields"><label>尺寸<select id="qrSize"><option>240</option><option>320</option><option>480</option></select></label><label>前景色<input id="qrColor" type="color" value="#111827"></label><label>背景色<input id="qrBackground" type="color" value="#ffffff"></label></div><label class="block-label">二维码内容<textarea id="qrText" placeholder="文本、网址、Wi-Fi 配置等"></textarea></label><div class="actions"><button id="generateQr">生成二维码</button><button class="ghost" id="downloadQr">下载 PNG</button><label class="upload-button">识别图片<input id="qrFile" type="file" accept="image/*"></label></div><div class="qr-stage"><img id="qrImage" alt="二维码预览"><div id="qrDecoded">识别结果将在这里显示</div></div></article>
      <article class="tool-panel" data-panel="cron"><div class="inline-fields"><label>Cron（5段）<input id="cronInput" value="*/5 * * * *"></label><label>预设<select id="cronPreset"><option value="">选择预设</option><option value="* * * * *">每分钟</option><option value="0 * * * *">每小时</option><option value="0 9 * * *">每天 09:00</option><option value="0 9 * * 1-5">工作日 09:00</option><option value="0 0 1 * *">每月 1 日</option></select></label></div><div class="actions"><button id="parseCron">解释并推算</button></div><pre id="cronResult">支持 *、范围、列表和步长；结果显示未来 10 次执行时间。</pre></article>
      <article class="tool-panel" data-panel="color"><div class="color-builder"><input id="colorA" type="color" value="#7c3aed"><input id="colorB" type="color" value="#22d3ee"><select id="gradientDirection"><option value="135deg">右下</option><option value="90deg">向右</option><option value="180deg">向下</option><option value="45deg">右上</option></select></div><div class="gradient-preview" id="gradientPreview"></div><input id="gradientCss" readonly><div class="palette" id="colorPalette"></div><div class="actions"><button id="randomPalette">随机调色板</button><button class="ghost" data-copy="gradientCss">复制 CSS</button></div></article>
      <article class="tool-panel" data-panel="command"><div class="request-line"><select id="commandShell"><option value="all">全部终端</option><option value="linux">Linux</option><option value="powershell">PowerShell</option><option value="cmd">CMD</option></select><input id="commandSearch" placeholder="搜索命令或用途，例如：端口、进程、文件"><button id="searchCommand">查询</button></div><div class="command-list" id="commandList"></div></article>
      <article class="tool-panel" data-panel="md5"><label class="block-label">待计算文本<textarea id="md5Input" placeholder="输入任意文本"></textarea></label><div class="actions"><button id="md5Generate">生成 MD5</button><button class="ghost" data-copy="md5Result">复制摘要</button></div><label class="block-label">MD5 结果<input id="md5Result" readonly></label><label class="block-label">比对已有 MD5<input id="md5Compare" placeholder="输入 32 位 MD5 后自动比对"></label><div class="status" id="md5Status">MD5 是不可逆摘要，无法解密；可通过重新计算原文进行比对。</div></article>
      <article class="tool-panel" data-panel="uuid"><div class="inline-fields"><label>数量<input id="uuidCount" type="number" min="1" max="100" value="5"></label><label>格式<select id="uuidCase"><option value="lower">小写</option><option value="upper">大写</option></select></label><label class="check"><input id="uuidHyphen" type="checkbox" checked>保留连字符</label></div><div class="actions"><button id="uuidGenerate">生成 GUID</button><button class="ghost" data-copy="uuidOutput">复制全部</button></div><textarea id="uuidOutput" readonly></textarea></article>
      <article class="tool-panel" data-panel="time"><div class="convert-card"><label>时间戳<input id="timestampInput" placeholder="秒或毫秒时间戳"></label><button id="timestampToDate">转换为日期 ↓</button><label>本地日期时间<input id="dateInput" type="datetime-local" step="1"></label><button id="dateToTimestamp">转换为时间戳 ↑</button></div><div class="result-box" id="timeResult">等待转换</div><button class="ghost now-button" id="useNow">使用当前时间</button></article>
      <article class="tool-panel" data-panel="http"><div class="request-line"><select id="httpMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input id="httpUrl" placeholder="https://api.example.com/data"><button id="sendHttp">发送请求</button></div><div class="editor-grid"><label>请求头（JSON）<textarea id="httpHeaders" placeholder='{"Authorization":"Bearer ..."}'></textarea></label><label>请求体<textarea id="httpBody" placeholder="JSON、文本或表单内容"></textarea></label></div><div class="response-meta" id="httpMeta">尚未发送请求</div><pre id="httpResponse">响应内容将显示在这里</pre></article>
      <article class="tool-panel" data-panel="socket"><div class="socket-tabs"><button class="active" data-socket-tab="ws">WebSocket</button><button data-socket-tab="mqtt">MQTT over WebSocket</button></div><div data-socket-pane="ws"><div class="request-line"><input id="wsUrl" value="wss://echo.websocket.events"><button id="wsConnect">连接</button><button class="danger" id="wsDisconnect">断开</button></div><div class="request-line"><input id="wsMessage" placeholder="要发送的消息"><button id="wsSend">发送</button></div></div><div class="hidden" data-socket-pane="mqtt"><div class="request-line"><input id="mqttUrl" placeholder="wss://broker.example.com:8084/mqtt"><input id="mqttClientId" placeholder="Client ID"><button id="mqttConnect">连接</button></div><div class="request-line"><input id="mqttUsername" placeholder="用户名（可选）"><input id="mqttPassword" type="password" placeholder="密码（可选）"></div><div class="request-line"><input id="mqttTopic" placeholder="主题，例如 test/mywebtab"><input id="mqttMessage" placeholder="消息"><button id="mqttSubscribe">订阅</button><button id="mqttPublish">发布</button></div></div><div class="terminal" id="socketLog"><div class="log-info">等待建立连接…</div></div></article>
    </section>
  </main><div class="copy-toast" id="copyToast">已复制</div><script type="module" src="src/tools.js"></script>
</body></html>
